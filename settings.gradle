pluginManagement {
	repositories {
		mavenCentral()
		gradlePluginPortal()
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.kikugie.dev/releases' }
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	shared {
		versions "26.2"
		vcsVersion = "26.2"
	}
	create(rootProject)
}